# CI gates (ROADMAP "never later" + M5). Runs on every push/PR.
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # release.yml runs these gates first

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, rustfmt
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci
      - run: npm run build

      - name: rustfmt
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: test
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: "honesty gate (PRODUCT §5: no anti-detection language in shipped code/UI)"
        shell: bash
        run: |
          # Scope: the shipping surface only (React UI + Rust). NOT docs/ or specs/, those
          # legitimately *discuss* the forbidden terms as the line not to cross (PRODUCT §5).
          if grep -rniE "undetectable|human-like|looks human|natural motion" \
               src src-tauri/src --include="*.rs" --include="*.ts" --include="*.tsx"; then
            echo "::error::banned anti-detection/marketing language in shipped code/UI (PRODUCT §5, Test 3)"
            exit 1
          fi

      - name: "platform boundary lint (constitution IV: no cfg(windows) outside platform/)"
        shell: bash
        run: |
          if grep -rn "cfg(windows)" src-tauri/src --include="*.rs" | grep -v "src-tauri/src/platform/"; then
            echo "::error::cfg(windows) leaked outside platform/ (constitution IV)"
            exit 1
          fi

      - name: "size gate (README budget: exe <= 8 MB)"
        shell: bash
        run: |
          cargo build --release --manifest-path src-tauri/Cargo.toml
          sz=$(stat -c%s src-tauri/target/release/project-mouse.exe)
          echo "release exe: $sz bytes"
          [ "$sz" -le 8388608 ] || { echo "::error::exe exceeds the 8 MB budget"; exit 1; }
