# Release pipeline (UPDATES.md §5). Runs the CI gates first; only if they pass does it build, sign
# the update artifacts and draft a GitHub release.
# Requires these repo secrets before it can sign; see docs/SHIP.md:
#   TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD  (minisign update key)
#   MANIFEST_TOKEN                                                  (cPanel latest.json publish)
# Authenticode/SmartScreen signing (SignPath) is a separate concern; see docs/SHIP.md.
name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    # The signing key lives in this environment: only v* tags may use it, and the owner approves
    # each run (Settings > Environments > release).
    environment: release
    permissions:
      contents: write
    runs-on: windows-latest
    env:
      MANIFEST_TOKEN: ${{ secrets.MANIFEST_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      # No npm or cargo cache here: the signed build starts clean, so a poisoned cache from
      # another run cannot reach an installer.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - run: npm ci
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # The key is password-less (generated with --ci), so the password is empty. Hardcoded
          # empty here so a mis-set password secret can never break signing again.
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: v__VERSION__
          releaseName: "project-mouse v__VERSION__"
          releaseBody: "Moves your mouse a few pixels when your PC has had no input for a while, and keeps the PC awake while it runs. What changed: [CHANGELOG.md](https://github.com/kalanadidulanga/project-mouse/blob/main/CHANGELOG.md). The installer is not code signed yet, so Windows SmartScreen warns on first install: More info > Run anyway ([code signing policy](https://github.com/kalanadidulanga/project-mouse#code-signing-policy))."
          releaseDraft: true # review before it reaches users
          prerelease: false

      # Push the update manifest to the own-domain endpoint (GitHub is the fallback).
      # A step's own env is not visible to its if, so the token is set on the job. tauri-action
      # uploads latest.json to the release only, so it is fetched from there first.
      - name: Publish update manifest
        if: ${{ env.MANIFEST_TOKEN != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${GITHUB_REF_NAME}" --pattern latest.json --clobber
          curl -f -X POST "https://kalanadidulanga.com/project-mouse/update/publish.php" \
               -H "Authorization: Bearer ${MANIFEST_TOKEN}" \
               -H "Content-Type: application/json" \
               --data-binary "@latest.json"
