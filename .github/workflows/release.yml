# Release pipeline (UPDATES.md §5). Runs the CI gates first; only if they pass does it build, sign
# the update artifacts and draft a GitHub release.
# Requires these repo secrets before it can sign; see docs/SHIP.md:
#   TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD  (minisign update key)
#   MANIFEST_TOKEN                                                  (cPanel latest.json publish)
# Authenticode/SmartScreen signing (SignPath) is a separate concern; see docs/SHIP.md.
name: release
on:
  push:
    tags: ["v*"]

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # The key is password-less (generated with --ci), so the password is empty. Hardcoded
          # empty here so a mis-set password secret can never break signing again.
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: v__VERSION__
          releaseName: "project-mouse v__VERSION__"
          releaseBody: "Moves your mouse a few pixels when your PC has had no input for a while, and keeps the PC awake while it runs. What changed: [CHANGELOG.md](https://github.com/kalanadidulanga/project-mouse/blob/main/CHANGELOG.md). Code signing policy: [README](https://github.com/kalanadidulanga/project-mouse#code-signing-policy)."
          releaseDraft: true # review before it reaches users
          prerelease: false

      # Push the update manifest to the own-domain endpoint (GitHub is the fallback).
      - name: Publish update manifest
        if: ${{ env.MANIFEST_TOKEN != '' }}
        env:
          MANIFEST_TOKEN: ${{ secrets.MANIFEST_TOKEN }}
        shell: bash
        run: |
          curl -f -X POST "https://kalanadidulanga.com/project-mouse/update/publish.php" \
               -H "Authorization: Bearer ${MANIFEST_TOKEN}" \
               -H "Content-Type: application/json" \
               --data-binary "@latest.json"
