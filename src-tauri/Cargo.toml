[package]
name = "project-mouse"
version = "0.1.0"
description = "A task-bound wake lock for Windows"
authors = ["Kalana"]
edition = "2021"

[lib]
name = "project_mouse_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", default-features = false, features = ["wry", "common-controls-v6", "tray-icon", "image-ico"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Power",
  "Win32_System_Threading",
  "Win32_System_SystemServices",
  "Win32_System_SystemInformation",
  "Win32_System_ProcessStatus",
  "Win32_System_Diagnostics_ToolHelp",
]

# ARCHITECTURE.md §10
[profile.release]
opt-level     = "z"
lto           = "fat"
codegen-units = 1
panic         = "abort"
strip         = true
